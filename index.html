    <!-- Installability is a DATA-SAFETY feature here, not a nicety. Progress
         lives in localStorage, and iOS Safari evicts script-writable storage
         after ~7 days without a visit. A web app added to the Home Screen runs
         standalone and is exempt from that sweep, so installing is currently
         the only thing protecting a learner's history between sessions.
         See ROADMAP P1 #4 — real account sync is the actual fix. -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="ChaiEnglish" />
    <meta name="mobile-web-app-capable" content="yes" />
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E🧡%3C/text%3E%3C/svg%3E" />
